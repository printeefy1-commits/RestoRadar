services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: restoradar
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: restoradar
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - restoradar-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restoradar -d restoradar']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  restoradar-db:
