name: restoradar-ec2
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: restoradar
      POSTGRES_DB: restoradar
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restoradar -d restoradar']
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  app:
    image: restoradar-app:${APP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/ec2/Dockerfile
    init: true
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_HOST: postgres
      COOKIE_SECURE: 'true'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in ec2.env}
      ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-false}
    secrets:
      - database_password
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  caddy:
    image: caddy:2
    depends_on:
      app: { condition: service_healthy }
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in ec2.env}
      # Internal service traffic must stay on the Docker network, including behind an egress proxy.
      NO_PROXY: app,localhost,127.0.0.1,::1
      no_proxy: app,localhost,127.0.0.1,::1
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

secrets:
  database_password:
    file: ${DATABASE_PASSWORD_PATH:-./.secrets/database_password}
volumes:
  database:
  certificates:
  caddy_config:
